<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BFS · 粘什么传什么</title>
    <link rel="icon" type="image/svg+xml" href="__BASE__/favicon.svg" />
    <link rel="stylesheet" href="__BASE__/static/style.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bfs.theme');
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar"></header>

      <main class="main is-wide">
        <div class="page-head">
          <h1>粘什么传什么</h1>
          <p>
            代码、日志、表格、diff、报错堆栈、图片、文件 —— 直接 <kbd>Ctrl</kbd>+<kbd>V</kbd>。
            自动识别是什么，按最合适的样子排版；生成后链接与提取码自动复制。
          </p>
        </div>

        <div class="send-main">
          <div class="card" id="captureCard">
              <div class="capture" id="dropzone">
                <textarea
                  class="capture-input"
                  id="pasteArea"
                  spellcheck="false"
                ></textarea>

                <div class="capture-empty" id="captureEmpty">
                  <div class="capture-icons">
                    <span class="icon-wrap" data-icon="paste"></span>
                    <span class="icon-wrap" data-icon="file"></span>
                    <span class="icon-wrap" data-icon="image"></span>
                  </div>
                  <strong>Ctrl+V 粘进来就行</strong>
                  <div class="capture-hints">
                    <span>代码 / 日志 / 表格 / diff / 堆栈</span>
                    <span>截图与图片</span>
                    <span>文件拖进来或点「选择文件」</span>
                  </div>
                  <div class="capture-limits" id="captureLimits"></div>
                </div>

                <input type="file" id="fileInput" multiple hidden />
              </div>

              <div class="capture-bar">
                <div class="detect" id="detect">
                  <span class="tag" id="detectTag">等待内容</span>
                  <span class="muted-2" id="detectDetail"></span>
                </div>
                <div class="capture-bar-actions">
                  <select class="input input--tiny" id="kindOverride" title="识别不对？手动指定">
                    <option value="">自动识别</option>
                  </select>
                  <button class="btn btn--ghost btn--sm" id="pickFile">
                    <span class="icon-wrap" data-icon="file"></span>选择文件
                  </button>
                  <button class="btn btn--ghost btn--sm" id="clearBtn">清空</button>
                </div>
              </div>

              <div class="preview-wrap hidden" id="previewWrap">
                <div class="preview-head">
                  <span>预览</span>
                  <span class="hint" id="previewHint"></span>
                </div>
                <div class="viewer" id="preview"></div>
              </div>

              <div class="file-strip hidden" id="fileStrip"></div>
            </div>

            <div class="send-actions">
              <span class="muted-2" id="errorText"></span>
              <button class="btn btn--primary btn--lg" id="submitBtn">
                <span class="icon-wrap" data-icon="upload"></span>生成链接
              </button>
            </div>

            <div id="progressWrap" class="hidden" style="padding: 12px 0">
              <div class="progress"><i id="progressBar"></i></div>
              <div class="field-note" id="progressText" style="margin-top: 6px"></div>
            </div>
      </div>
      </main>

      <footer class="foot">
        <span>__FOOTER__</span>
      </footer>
    </div>

    <div class="modal-mask hidden" id="optionsMask">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="optionsTitle">
        <div class="modal-head">
          <span id="optionsTitle">发送参数</span>
          <button class="btn btn--ghost btn--sm btn--icon" id="optionsClose" title="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="grid-3">
            <div class="field">
              <label for="ttl">有效期</label>
              <select class="input" id="ttl">
                <option value="1">1 小时</option>
                <option value="6">6 小时</option>
                <option value="24" selected>1 天</option>
                <option value="72">3 天</option>
                <option value="168">7 天</option>
                <option value="0">不设过期</option>
              </select>
            </div>
            <div class="field">
              <label for="reads">可读次数</label>
              <select class="input" id="reads">
                <option value="1" selected>1 次（阅后即焚）</option>
                <option value="3">3 次</option>
                <option value="10">10 次</option>
                <option value="-1">不限次数</option>
              </select>
            </div>
            <div class="field">
              <label for="code">提取码</label>
              <div class="row" style="flex-wrap: nowrap; gap: 6px">
                <input class="input" id="code" maxlength="12" placeholder="自动生成" />
                <button class="btn btn--sm" id="genCode" type="button">随机</button>
              </div>
            </div>
          </div>

          <label class="switch-row" style="margin-top: 12px">
            <input type="checkbox" id="noCode" />
            <span>不要提取码（拿到链接即可打开）</span>
          </label>

          <label class="switch-row" style="margin-top: 10px">
            <input type="checkbox" id="rememberOptions" checked />
            <span>记住这些参数（下次生成默认用这套）</span>
          </label>

          <div class="banner banner--warn hidden" id="fwNote" style="margin-top: 14px">
            <span class="icon-wrap" data-icon="chip"></span>
            <div>
              固件文件会额外给一个 <strong>设备直链</strong>，模组可以 HTTP GET 拉取，拉到即销毁。
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <span class="muted-2" id="optionsSummary"></span>
          <button class="btn btn--primary" id="confirmBtn">生成并复制</button>
        </div>
      </div>
    </div>

    <div class="modal-mask hidden" id="resultMask">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="modal-head">
          <span id="resultTitle">已生成</span>
          <button class="btn btn--ghost btn--sm btn--icon" id="resultClose" title="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="result">
            <div class="copy-row">
              <input class="input mono" id="shareUrl" readonly />
              <button class="btn" id="copyLink">复制链接</button>
            </div>
            <div id="codeRow" class="row" style="display: none">
              <span class="muted-2">提取码</span>
              <span class="code-token" id="shareCode"></span>
              <button class="btn btn--sm" id="copyCode">复制</button>
            </div>
            <dl class="kv" id="resultMeta"></dl>

            <div id="otaBlock" style="display: none">
              <div class="section-title" style="margin-top: 4px">
                设备直链 <span class="hint">拉到即销毁</span>
              </div>
              <div class="copy-row">
                <input class="input mono" id="otaUrl" readonly />
                <button class="btn" id="copyOta">复制</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <span class="field-note" id="autoCopyHint"></span>
          <div class="btn-row">
            <button class="btn btn--danger btn--sm" id="burnBtn">
              <span class="icon-wrap" data-icon="fire"></span>立即焚毁
            </button>
            <button class="btn btn--sm" id="openLink">打开</button>
            <button class="btn btn--sm" id="newShare">继续传</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="__BASE__/static/index.js"></script>
  </body>
</html>
